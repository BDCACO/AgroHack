[project]
name = "campocerto-backend"
version = "0.1.0"
description = "CampoCerto — gestão inteligente de insumos rurais (API)"
requires-python = ">=3.14,<3.15"
# Faixas com teto: um major novo de qualquer uma delas é decisão, não
# atualização silenciosa (mesmo critério do ArkoHub).
dependencies = [
    "fastapi>=0.143.3,<0.144.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "sqlalchemy>=2.1.5,<3.0.0",
    "alembic>=1.20.0,<2.0.0",
    "pydantic-settings>=2.16.0,<3.0.0",
    # Driver síncrono do PostgreSQL. A API é síncrona de propósito: as análises
    # vão rodar sobre Pandas, que é CPU-bound e síncrono — ver docs/ARQUITETURA.md.
    "psycopg[binary]>=3.3.6,<4.0.0",
    # Planilha do Excel (.xlsx): ler a importação e gerar o modelo formatado.
    "openpyxl>=3.1.5,<4.0.0",
    # O openpyxl o usa sozinho, quando instalado, contra XML malicioso (bomba de
    # entidades) num .xlsx enviado por upload.
    "defusedxml>=0.7.1,<0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    # Exigido pelo TestClient do Starlette.
    "httpx>=0.28.1,<0.29.0",
    "ruff>=0.17.1,<0.18.0",
]

[tool.uv]
# É uma aplicação, não uma biblioteca: nada a empacotar.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PT", "DTZ", "RUF"]
# Comentários em português usam tipografia real (—, aspas curvas); RUF001-3 só
# gerariam ruído aqui.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Idioma do FastAPI: Depends(...) como default de argumento.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
