<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: no app instalado, a tela vai até as bordas e o layout respeita
         o entalhe e a barra de gestos (env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3b17" />
    <meta name="description" content="CampoCerto: gestão inteligente de insumos rurais." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Instalável na tela inicial do celular, como um app (Android pelo manifesto, iPhone
         pelas metas da Apple). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CampoCerto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CampoCerto</title>
    <!-- O tema escolhido em Configurações, antes de a página aparecer: sem ele aqui, o tema
         escuro piscaria branco a cada recarga, até o Vue carregar (src/tema.ts). -->
    <script>
      try {
        var tema = localStorage.getItem('campocerto.tema')
        if (tema === 'sistema') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.tema = tema === 'escuro' ? 'escuro' : 'claro'
      } catch (erro) {
        document.documentElement.dataset.tema = 'claro'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
