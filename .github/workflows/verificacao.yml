# O mesmo que o `make verify`, em todo PR e em todo push na main: lint, tipos e testes
# (e o do app Flutter, que o make verify ainda não roda).
# Roda direto nas máquinas do GitHub (uv e Node), sem Docker: os testes do backend usam
# SQLite em memória, e os do frontend substituem a API por mocks.
name: Verificação

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a verificação anterior, que já ficou velha.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Um teste travado não prende a máquina do GitHub por horas.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # O Python vem do backend/.python-version; o uv o instala.
      # Sem tag flutuante de versão maior nesta action: fixa a versão inteira.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backend-integracao:
    name: Backend (integração com PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Banco descartável: a suíte apaga e recria o schema dele.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: campocerto_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRACAO_DATABASE_URL: postgresql+psycopg://postgres:teste@127.0.0.1:5432/campocerto_teste
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run pytest tests/integracao

  frontend:
    name: Frontend (vue-tsc + eslint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  mobile:
    name: App (flutter analyze + flutter test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      # A mesma versão do Flutter com que o projeto foi gerado.
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
