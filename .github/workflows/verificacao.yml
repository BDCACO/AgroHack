# O mesmo que o `make verify`, em todo PR e em todo push na main: lint, tipos e testes.
# Roda direto nas máquinas do GitHub (uv e Node), sem Docker: os testes do backend usam
# SQLite em memória, e os do frontend substituem a API por mocks.
name: Verificação

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a verificação anterior, que já ficou velha.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # O Python vem do backend/.python-version; o uv o instala.
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: Frontend (vue-tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
